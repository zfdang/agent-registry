server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Hashed build assets are immutable — cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so deploys are picked up
    # immediately by clients holding the SPA shell.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: any unmatched path (e.g. /agents/foo.example/bar) resolves
    # client-side via the router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
