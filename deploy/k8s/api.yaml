apiVersion: v1
kind: Service
metadata:
  name: registry-api
  namespace: agent-registry
  labels:
    app.kubernetes.io/part-of: agent-registry
spec:
  selector:
    app: registry-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-api
  namespace: agent-registry
  labels:
    app.kubernetes.io/part-of: agent-registry
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app: registry-api
  template:
    metadata:
      labels:
        app: registry-api
    spec:
      containers:
        - name: api
          image: localhost/agent-registry/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: REGISTRY_PORT
              value: "8080"
            - name: REGISTRY_PUBLIC_URL
              value: https://registry.ip402.xyz
            - name: REGISTRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: registry-secrets
                  key: REGISTRY_DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health?ready=1
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
