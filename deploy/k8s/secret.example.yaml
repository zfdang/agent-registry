# Never commit a real secret. Create it out-of-band, e.g.:
#
#   PGPASS=$(openssl rand -hex 24)
#   kubectl -n agent-registry create secret generic registry-secrets \
#     --from-literal=POSTGRES_PASSWORD="$PGPASS" \
#     --from-literal=REGISTRY_DATABASE_URL="postgres://registry:${PGPASS}@postgres:5432/registry?sslmode=disable"
#
apiVersion: v1
kind: Secret
metadata:
  name: registry-secrets
  namespace: agent-registry
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<random>"
  REGISTRY_DATABASE_URL: "postgres://registry:<random>@postgres:5432/registry?sslmode=disable"
