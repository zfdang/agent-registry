apiVersion: v1
kind: Service
metadata:
  name: registry-web
  namespace: agent-registry
  labels:
    app.kubernetes.io/part-of: agent-registry
spec:
  selector:
    app: registry-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-web
  namespace: agent-registry
  labels:
    app.kubernetes.io/part-of: agent-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-web
  template:
    metadata:
      labels:
        app: registry-web
    spec:
      containers:
        - name: web
          image: localhost/agent-registry/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
